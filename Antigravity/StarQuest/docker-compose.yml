services:
  # ── Development server (hot-reload) ─────────────────────────────────────────
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      # Mount the project directory so edits on the host are reflected instantly
      - .:/app
      # Anonymous volume keeps node_modules inside the container
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    env_file:
      - .env
    environment:
      - NODE_ENV=development

  # ── Production build served by Nginx ────────────────────────────────────────
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
